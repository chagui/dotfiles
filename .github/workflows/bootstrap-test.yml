name: Bootstrap test

on:
  pull_request:
    paths:
      - '.chezmoiscripts/**'
      - '.chezmoiexternal.toml'
      - '.chezmoi.toml.tmpl'
      - '.chezmoiignore'
      - 'tests/bootstrap/**'
      - '.github/workflows/bootstrap-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install chezmoi, shellcheck, shfmt
        run: |
          curl -fsLS https://get.chezmoi.io | sudo sh -s -- -b /usr/local/bin
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64" -o /tmp/shfmt
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: Run smoke tier
        run: bash tests/bootstrap/smoke.sh

  linux-bootstrap:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run e2e-linux
        run: bash tests/bootstrap/e2e-linux.sh

  macos-bootstrap:
    needs: smoke
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install chezmoi
        run: brew install chezmoi
      - name: Run e2e-macos
        env:
          BOOTSTRAP_TEST_SANDBOX: '1'
          CHEZMOI_SKIP_CLAUDE_INSTALL: '1'
        run: bash tests/bootstrap/e2e-macos.sh
