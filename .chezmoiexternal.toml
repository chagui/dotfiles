[".config/bat/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/bat/archive/master.tar.gz"
    exact = true
    stripComponents = 2
    refreshPeriod = "168h"
    #include = ["*/themes/Catppuccin Frappe.tmThem", "**/Catppuccin Macchiato.tmThem"]
    include = ["*/themes/**"]
    #path = "themes"

# Datadog agent skills (https://github.com/datadog-labs/agent-skills)
#
# Pinned to a commit so upstream changes land as a reviewable diff here.
# To upgrade, replace the SHA in every URL below (all five must match).
#
# Whole directories, not single SKILL.md files: dd-apm routes to sub-skills
# under dd-apm/{k8s-ssi,linux-ssi,enable-dsm,service-remapping}/ by path.
#
# One entry per skill so `exact` only prunes inside each dd-* directory and
# never touches the other skills in ~/.claude/skills. chezmoi downloads the
# shared URL once. The upstream plugin was rejected: it bundles ~60 skills
# (~6k tokens of skill listing per session).
[".claude/skills/dd-apm"]
    type = "archive"
    url = "https://github.com/datadog-labs/agent-skills/archive/6bd95cce9e0792c0f27c342214609706e51313c3.tar.gz"
    exact = true
    stripComponents = 2
    include = ["*/dd-apm/**"]

[".claude/skills/dd-docs"]
    type = "archive"
    url = "https://github.com/datadog-labs/agent-skills/archive/6bd95cce9e0792c0f27c342214609706e51313c3.tar.gz"
    exact = true
    stripComponents = 2
    include = ["*/dd-docs/**"]

[".claude/skills/dd-logs"]
    type = "archive"
    url = "https://github.com/datadog-labs/agent-skills/archive/6bd95cce9e0792c0f27c342214609706e51313c3.tar.gz"
